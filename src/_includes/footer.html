<footer class="footer">
  <div class="contact">
    <div class="contact-row">
      <span class="contact-label" data-i18n="contact">تماس با ما :</span>
      <div class="contact-links">
        {% if site.author.email %}
          <a
            class="contact-icon"
            href="mailto:{{ site.author.email }}"
            data-i18n="contact.email"
            data-i18n-attr="aria-label"
            aria-label="ایمیل"
            title="ایمیل"
          >
            <img src="/assets/img/contact/email.png" alt="" width="40" height="40" />
          </a>
        {% endif %}
      </div>
    </div>

    <div class="contact-row">
      <span class="contact-label" data-i18n="social">شبکه‌های اجتماعی :</span>
      <div class="contact-links">
        {% if site.author.discord %}
          <a
            class="contact-icon"
            href="{{ site.author.discord }}"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="contact.discord"
            data-i18n-attr="aria-label"
            aria-label="دیسکورد"
            title="دیسکورد"
          >
            <img src="/assets/img/contact/discord.png" alt="" width="40" height="40" />
          </a>
        {% endif %}

        {% if site.author.telegram %}
          <a
            class="contact-icon"
            href="{{ site.author.telegram }}"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="contact.telegram"
            data-i18n-attr="aria-label"
            aria-label="تلگرام"
            title="تلگرام"
          >
            <img src="/assets/img/contact/telegram.png" alt="" width="40" height="40" />
          </a>
        {% endif %}

        {% if site.author.github %}
          <a
            class="contact-icon"
            href="https://github.com/{{ site.author.github }}"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="contact.github"
            data-i18n-attr="aria-label"
            aria-label="گیت‌هاب"
            title="گیت‌هاب"
          >
            <img src="/assets/img/contact/github.png" alt="" width="40" height="40" />
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</footer>


{% include javascripts.html %}
